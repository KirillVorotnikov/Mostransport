name: mostransport

services:
  web:
    build: .
    image: mostransport:local
    ports:
      - "${PORT:-8765}:8765"
    environment:
      HOST: 0.0.0.0
      PORT: "8765"
      DB_PATH: /var/lib/mostransport/auth.sqlite
    volumes:
      - auth:/var/lib/mostransport
    restart: unless-stopped

volumes:
  auth:
